$kind: http-request
description: Every race a driver started, 100 per page. Used by `src/fetch/fetch_driver_races.py`.
url: "{{jolpica}}/drivers/{{driverId}}/results.json?limit=100&offset={{offset}}"
method: GET
queryParams:
  - key: limit
    value: "100"
  - key: offset
    value: "{{offset}}"
    description: Jolpica pages by result row, not by race. Read MRData.total.
order: 10000
