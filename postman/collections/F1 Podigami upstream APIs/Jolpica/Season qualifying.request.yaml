$kind: http-request
description: Qualifying order with Q1/Q2/Q3 times. Rows aren't always stored in position order. Used by `src/fetch/fetch_qualifying.py`.
url: "{{jolpica}}/{{season}}/qualifying.json?limit=100&offset={{offset}}&_={{$timestamp}}"
method: GET
queryParams:
  - key: limit
    value: "100"
  - key: offset
    value: "{{offset}}"
    description: Jolpica pages by result row, not by race. Read MRData.total.
  - key: _
    value: "{{$timestamp}}"
    description: Cache-buster. Jolpica caches by request headers and can serve hour-old current-season data; a unique value gets fresh data. Untick it to see what a cached client sees.
order: 6000
