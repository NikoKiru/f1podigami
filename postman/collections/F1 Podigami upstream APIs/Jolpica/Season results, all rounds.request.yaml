$kind: http-request
description: "Full classifications, 100 result rows per page: step `{{offset}}` by 100. Used by `src/fetch/fetch_race_results.py`."
url: "{{jolpica}}/{{season}}/results.json?limit=100&offset={{offset}}&_={{$timestamp}}"
method: GET
queryParams:
  - key: limit
    value: "100"
  - key: offset
    value: "{{offset}}"
    description: Jolpica pages by result row, not by race. Read MRData.total.
  - key: _
    value: "{{$timestamp}}"
    description: Cache-buster. Jolpica caches by request headers and can serve hour-old current-season data; a unique value gets fresh data. Untick it to see what a cached client sees.
order: 2000
