$kind: http-request
description: Everyone with any entry this season, reserves included. `src/fetch/fetch_current_drivers.py` only falls back to it before the first race; otherwise it takes the drivers who actually started.
url: "{{jolpica}}/{{season}}/drivers.json?limit=100&_={{$timestamp}}"
method: GET
queryParams:
  - key: limit
    value: "100"
  - key: _
    value: "{{$timestamp}}"
    description: Cache-buster. Jolpica caches by request headers and can serve hour-old current-season data; a unique value gets fresh data. Untick it to see what a cached client sees.
order: 8000
