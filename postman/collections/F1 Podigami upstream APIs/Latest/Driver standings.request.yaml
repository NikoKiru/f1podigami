$kind: http-request
description: Not used by the pipeline, but the quickest way to see which round Jolpica's standings have reached.
url: "{{jolpica}}/{{season}}/driverStandings.json?limit=100&_={{$timestamp}}"
method: GET
queryParams:
  - key: limit
    value: "100"
  - key: _
    value: "{{$timestamp}}"
    description: Cache-buster. Jolpica caches by request headers and can serve hour-old current-season data; a unique value gets fresh data. Untick it to see what a cached client sees.
order: 3000
