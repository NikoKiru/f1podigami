$kind: http-request
description: Every race's P`{{position}}` this season (1, 2 or 3). Used by `src/fetch/fetch_podiums.py`.
url: "{{jolpica}}/{{season}}/results/{{position}}.json?limit=100&_={{$timestamp}}"
method: GET
queryParams:
  - key: limit
    value: "100"
  - key: _
    value: "{{$timestamp}}"
    description: Cache-buster. Jolpica caches by request headers and can serve hour-old current-season data; a unique value gets fresh data. Untick it to see what a cached client sees.
order: 4000
