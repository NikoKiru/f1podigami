name: Update Race Data

on:
  schedule:
    - cron: "2,17,32,47 * * * *" # every 15 min, guarded incremental refresh (offset off the hour to dodge load)
    - cron: "0 7 * * 1" # Monday 07:00 UTC, unconditional --full reconciliation
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = guarded incremental; full = unconditional --full reconciliation"
        type: choice
        options:
          - auto
          - full
        default: auto
      force:
        description: "When mode=auto, run even if the guard says no update is due"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write # open/refresh a failure-alert issue when an update run fails

# Never run two data updates at once, and don't cancel one mid-commit.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  # Cheap, no-network gate. Most runs stop here in ~15s.
  check:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.decide.outputs.due }}
      mode: ${{ steps.decide.outputs.mode }}
    steps:
      # Pin to main: data PRs merge into main, so main's podigami.json asOf is
      # the only one that advances. A scheduled run checks out the default
      # branch (develop), whose stale asOf would re-report the same race as
      # due after every merge, looping the update forever.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Decide whether an update is due
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          # Weekly cron OR an explicit full dispatch => unconditional --full.
          if [ "$CRON" = "0 7 * * 1" ] || { [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_MODE" = "full" ]; }; then
            {
              echo "mode=full"
              echo "due=true"
            } >> "$GITHUB_OUTPUT"
            echo "Unconditional full reconciliation -> due=true mode=full"
            exit 0
          fi
          echo "mode=normal" >> "$GITHUB_OUTPUT"
          # A forced normal dispatch bypasses the guard.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_FORCE" = "true" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            echo "Forced normal run -> due=true mode=normal"
            exit 0
          fi
          # Scheduled cron (or an unforced auto dispatch): consult the cheap local
          # guard, which appends due=true|false to $GITHUB_OUTPUT (no network).
          python src/check_update_due.py

  # Full refresh: only runs when the guard (or an unconditional trigger) says so.
  update:
    needs: check
    if: needs.check.outputs.due == 'true'
    runs-on: ubuntu-latest
    # Covers the watcher's 2h poll budget plus the pipeline, well under the 6h cap.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Pin to main: the data branch must be cut from main (the PR base),
          # not the default branch (develop) — otherwise unpromoted develop
          # commits ride along into main inside the data PR.
          ref: main
          # PAT (not the built-in token) so the branch push + PR trigger CI, and
          # the eventual squash-merge is attributed to a real user so deploy fires.
          token: ${{ secrets.DATA_PUSH_TOKEN }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      # GitHub honours only a fraction of our 15-min cron (~1 run/hour observed,
      # with multi-hour overnight gaps), so a fetch that lands before the API has
      # published the race costs a WHOLE HOUR before the next attempt — that is
      # what put the 2026 Belgian GP on the site ~100min late. Hold the runner
      # and poll until the round appears instead, so cron only has to land one
      # slot in a wide window. Scheduled runs only: a human dispatch should act
      # now, not block for up to 2h, and `full` is a reconciliation, not a race.
      - name: Wait for the finished race to be published upstream
        if: needs.check.outputs.mode != 'full' && github.event_name == 'schedule'
        run: python src/wait_for_results.py

      - name: Fetch latest data and rebuild site
        run: |
          if [ "${{ needs.check.outputs.mode }}" = "full" ]; then
            python src/update.py --full
          else
            python src/update.py
          fi
      # Jolpica can rewrite a race the site already published: the 2026 Monaco
      # GP's P3 went Hadjar -> Gasly -> Hadjar and both edits merged unread, so
      # the site listed a trio that never officially happened for 82 days.
      # Compare every podium already on main with the refreshed data. A change
      # retitles the PR and opens an issue (below) but never blocks the merge —
      # holding this PR would hold every later race too.
      #
      # Guarded: a scheduled run takes this workflow from develop but checks out
      # main's scripts, so between merging to develop and promoting to main the
      # script is not there yet. Skip rather than fail every data update.
      # continue-on-error: an unexpected crash here must never block the data PR.
      - name: Detect podium revisions
        id: revisions
        continue-on-error: true
        run: |
          if [ -f src/check_revisions.py ]; then
            python src/check_revisions.py --out-dir "$RUNNER_TEMP/podium-revisions"
          else
            echo "check_revisions.py is not on main yet; skipping."
            echo "revised=false" >> "$GITHUB_OUTPUT"
          fi
      # Open/refresh the PR BEFORE validating: a bad-data run then surfaces as a
      # visible red PR (whose required checks gate the auto-merge) instead of a
      # silently-skipped step. The validate + tests below still run, so a bad run
      # also goes red and trips the failure alert (notify-failure job).
      - name: Open or refresh the data PR and arm auto-merge
        env:
          GH_TOKEN: ${{ secrets.DATA_PUSH_TOKEN }}
          REVISION_TITLE: ${{ steps.revisions.outputs.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes; nothing to do."
            exit 0
          fi
          BRANCH="auto/update-data"
          DATE="$(date -u +%Y-%m-%dT%H:%MZ)"
          TITLE="Update race data $DATE"
          if [ -n "$REVISION_TITLE" ]; then
            TITLE="$TITLE · $REVISION_TITLE"
          fi
          # Dedicated bot-only branch, serialized by the workflow concurrency group,
          # so a plain force-push is safe.
          git checkout -B "$BRANCH"
          git commit -m "$TITLE"
          git push --force origin "$BRANCH"
          PR="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')"
          if [ -z "$PR" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "$TITLE" \
              --body "Automated race-data refresh. Auto-merges once all required checks pass."
          fi
          gh pr merge --auto --squash --delete-branch "$BRANCH"
          # A refresh re-derives the title from the comparison with main, so a
          # revision shows even when it lands on a PR that was already open.
          # Retitle AFTER auto-merge is armed, via the REST API (Pull requests:
          # write is enough — unlike `gh pr edit`, which also queries
          # projects/labels/milestones DATA_PUSH_TOKEN may not be allowed to
          # read), and never fatally: a revision alert must not fail the
          # data update.
          if [ -n "$PR" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$PR" -f title="$TITLE" >/dev/null \
              || echo "::warning::Could not retitle data PR #$PR"
          fi
      # The built-in token, not the PAT: DATA_PUSH_TOKEN carries no Issues
      # permission. One issue per revision, deduplicated by title against OPEN
      # podium-revised issues only — a human closing one re-arms it, so a
      # repeat flip-flop after that still notifies — left open for a human
      # since it's a notification, not a failure, so nothing auto-closes it.
      # Issues are created FIRST and loudly (a failed `gh issue create` fails
      # this step); the PR label is cosmetic and applied after, non-fatally.
      - name: Flag podium revisions for a human
        if: steps.revisions.outputs.revised == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVISIONS_DIR: ${{ runner.temp }}/podium-revisions
        run: |
          gh label create podium-revised --repo "$GITHUB_REPOSITORY" \
            --color FBCA04 --description "A data update changed an already-published podium" 2>/dev/null || true
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --label podium-revised \
            --state open --limit 200 --json title --jq '.[].title')"
          for f in "$REVISIONS_DIR"/*.md; do
            [ -e "$f" ] || continue
            title="$(head -n 1 "$f")"
            if printf '%s\n' "$existing" | grep -Fxq -- "$title"; then
              echo "Already reported: $title"
              continue
            fi
            tail -n +3 "$f" > "$RUNNER_TEMP/issue-body.md"
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --label podium-revised --body-file "$RUNNER_TEMP/issue-body.md"
          done
          PR="$(gh pr list --repo "$GITHUB_REPOSITORY" --head auto/update-data --state open \
            --json number --jq '.[0].number')"
          if [ -n "$PR" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/labels" \
              -f "labels[]=podium-revised" >/dev/null \
              || echo "::warning::Could not label data PR #$PR"
          fi
      - name: Validate datasets
        run: PYTHONPATH=src python -m datalib.validate
      - name: Run tests
        run: pytest -q

  # A green update run is not the same as the data shipping. At the 2026
  # Hungarian GP every job passed — guard fired, pipeline ran, PR opened with
  # auto-merge armed — and the site still stalled ~2h, because a required check
  # *on the PR* failed for a reason of its own (an unpinned ruff resolved to
  # 0.16.0, #227). notify-failure watches the run, so nothing pinged. Watch the
  # PR too, on every tick, whether or not an update was due (#229).
  #
  # Deliberately NOT pinned to main like the jobs above: this reads no data, and
  # the script must come from the same ref as this workflow file (the default
  # branch, on a schedule) or it would break in the window between merging to
  # develop and promoting to main.
  watchdog:
    runs-on: ubuntu-latest
    outputs:
      stalled: ${{ steps.stall.outputs.stalled }}
      open: ${{ steps.stall.outputs.open }}
      reason: ${{ steps.stall.outputs.reason }}
      pr: ${{ steps.stall.outputs.pr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Look for a data PR that will not merge on its own
        id: stall
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --head auto/update-data --state open \
            --json number,url,createdAt,mergeStateStatus,autoMergeRequest,statusCheckRollup \
            | python src/check_stalled_data_pr.py

  # Whether the run failed or the PR it opened is wedged, the outcome is the
  # same — the site stalls one race behind, the guard re-fires every tick, and
  # nobody is watching the Actions tab. Make it loud: open, or refresh, a single
  # deduplicated issue so it pings a human within one cron tick. Loud means
  # informative, not chatty: an unchanged failure gets NO new comment — the
  # Aug 2026 stall buried itself under 400+ identical "still failing" comments
  # on a month-old issue, which pings nobody (#245).
  notify-failure:
    needs: [check, update, watchdog]
    if: always() && (failure() || needs.watchdog.outputs.stalled == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Open or refresh the failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STALL_REASON: ${{ needs.watchdog.outputs.reason }}
          STALLED_PR: ${{ needs.watchdog.outputs.pr }}
        run: |
          # Two ways in: the run went red, or the run was fine but the PR it
          # left behind is wedged. Same consequence, same alert issue.
          if [ -n "$STALL_REASON" ]; then
            headline="The open data PR is not merging: $STALL_REASON"
            where="Blocked PR: $STALLED_PR"
          else
            headline="The automated data update run failed"
            where="Failed run: $RUN_URL"
          fi
          gh label create auto-update-failure --repo "$GITHUB_REPOSITORY" \
            --color B60205 --description "update.yml data refresh is failing" 2>/dev/null || true
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label auto-update-failure --json number --jq '.[0].number // empty')"
          # The body's first line is exactly "$headline." — the marker the next
          # tick compares against to detect a repeat vs a changed failure.
          body="$headline"$'.\n\nThe site will stall one race behind until it is fixed (the guard keeps firing but no data PR merges).\n\n'"$where"$'\n\nDiagnose per CLAUDE.md (Deployment > "When a finished race does not appear"). Typical tells: check green with update red (Run tests failed), or an open auto/update-data PR whose required checks are red. This issue closes itself once no data PR is left open.\n\ncc @NikoKiru'
          if [ -z "$existing" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "⚠️ Automated data update is failing" \
              --label auto-update-failure --body "$body"
          elif [ "$(gh issue view "$existing" --repo "$GITHUB_REPOSITORY" --json body --jq .body | head -n 1)" = "${headline}." ]; then
            echo "Unchanged failure already reported in #$existing; staying quiet."
          else
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Failure changed as of $(date -u +%Y-%m-%dT%H:%MZ): $headline. $where"
          fi

  # The flip side: the moment no auto/update-data PR is left open (merged, or
  # closed by hand) the incident is over. Close the alert issue so the NEXT
  # incident opens a FRESH issue — a new issue notifies a human, whereas a
  # comment on a month-old open one does not (how #245 sat blocked for 15 days).
  notify-recovery:
    needs: [check, update, watchdog]
    if: always() && !failure() && needs.watchdog.outputs.open == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Close the failure issue once no data PR is left open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label auto-update-failure --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" \
              --comment "Recovered: no auto/update-data PR is open any more. A new incident will open a fresh issue."
          else
            echo "No open failure issue; nothing to close."
          fi
